<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0c0e12" />
<title>AtlasX</title>
<script src="/assets/theme.js?v=3.6.0-3"></script>
<link rel="stylesheet" href="/v3/app.css?v=3.6.0-3" />
<script>
  window.__DSH_V3__ = true;
</script>
</head>
<body>
<div class="app" id="app">
  <aside class="rail">
    <div class="logo" title="AtlasX">A</div>
    <button class="rail-btn active" data-section="work" title="工单">
      <svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/></svg>
      <span class="rail-badge" id="workBadge" hidden>0</span>
    </button>
    <button class="rail-btn" data-section="conv" title="会话">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/></svg>
    </button>
    <button class="rail-btn" data-section="ws" title="工作区">
      <svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h9A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5Z"/></svg>
    </button>
    <button class="rail-btn" data-section="role" title="组织与角色">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.4 3.1-5.6 7-5.6s7 2.2 7 5.6"/></svg>
    </button>
    <button class="rail-btn" data-section="group" title="群组">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="2.6"/><path d="M3.6 19c0-2.6 2.4-4.4 5.4-4.4s5.4 1.8 5.4 4.4"/><circle cx="17" cy="9" r="2.2"/><path d="M15.8 14.8c2.4.3 4.2 2 4.2 4.2"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="rail-btn theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">
      <svg class="theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <span class="theme-auto" id="themeAuto" title="按系统时间自动切换" hidden></span>
    </button>
    <button class="rail-btn" data-section="settings" title="设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
    <button class="rail-btn" data-section="about" title="关于">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    </button>
    <div class="me" id="meBadge">Z</div>
  </aside>

  <section class="listpane">
    <header class="listpane-head">
      <div class="listpane-title">
        <h2 id="listTitle">工单</h2>
        <div class="listpane-actions">
          <button class="iconbtn" id="listRefresh" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
          </button>
          <button class="iconbtn" id="listAdd" title="新建">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="searchInput" placeholder="搜索" autocomplete="off" />
      </label>
    </header>
    <div class="list" id="listBody"></div>
    <footer class="listpane-foot" id="listFoot"></footer>
  </section>

  <main class="canvas">
    <header class="canvas-head">
      <div class="crumb" id="crumb"></div>
      <div class="head-actions" id="canvasActions"></div>
    </header>
    <div class="canvas-body" id="canvasBody"></div>
    <div class="chat-shell" id="chatShellV3" hidden>
      <div class="chat-host" id="chatHostV3"></div>
    </div>
  </main>
  <aside class="team-task-float" id="teamTaskFloat" hidden></aside>
</div>

<button class="ga-fab" id="gaFab" title="工单" aria-label="工单">
  <svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="4"/><path d="M12 4v4M9 13h.01M15 13h.01M9 16h6"/></svg>
  <span class="ga-badge ga-auth" id="gaAuthBadge" hidden>0</span>
  <span class="ga-badge ga-note" id="gaNoteBadge" hidden>0</span>
</button>
<aside class="ga-panel" id="gaPanel" hidden aria-label="工单"></aside>

<div class="agent-canvas" id="agentCanvas" hidden>
  <header class="agent-canvas-head">
    <div>
      <h2>执行画布</h2>
      <p id="agentCanvasSub">主代理 / 团队成员 / 子代理</p>
    </div>
    <div class="agent-canvas-actions">
      <div class="seg" id="agentCanvasFilter">
        <button type="button" data-graph-filter="all" class="on">全部</button>
        <button type="button" data-graph-filter="running">运行中</button>
        <button type="button" data-graph-filter="failed">失败</button>
      </div>
      <button class="btn small" type="button" id="agentCanvasReplay">回放</button>
      <button class="iconbtn" type="button" id="agentCanvasZoomOut" title="缩小">−</button>
      <button class="iconbtn" type="button" id="agentCanvasZoomIn" title="放大">＋</button>
      <button class="iconbtn" type="button" id="agentCanvasFit" title="适应">⛶</button>
      <button class="iconbtn" type="button" id="agentCanvasRefresh" title="刷新">↻</button>
      <button class="iconbtn" type="button" id="agentCanvasClose" title="关闭">×</button>
    </div>
  </header>
  <div class="agent-canvas-body">
    <div class="agent-canvas-wrap" id="agentCanvasWrap">
      <div class="agent-canvas-stage" id="agentCanvasStage"></div>
    </div>
    <aside class="agent-activity">
      <section><h3>最近活动</h3><div class="agent-feed" id="agentActivity"></div></section>
      <section><h3>即将</h3><div class="agent-feed" id="agentUpcoming"></div></section>
      <section><h3>刚刚发生</h3><div class="agent-feed" id="agentJustHappened"></div></section>
    </aside>
  </div>
</div>

<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="side-drawer" id="sideDrawer" hidden aria-label="群聊设置">
  <header class="side-drawer-head">
    <div>
      <h2 id="sideDrawerTitle">群聊设置</h2>
      <p id="sideDrawerSub"></p>
    </div>
    <button class="iconbtn" id="sideDrawerClose" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <div class="side-drawer-body" id="sideDrawerBody"></div>
  <footer class="side-drawer-foot" id="sideDrawerFoot"></footer>
</aside>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h2 id="modalTitle">编辑</h2>
      <button class="iconbtn" id="modalClose" title="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="modal-body" id="modalBody"></div>
    <footer class="modal-foot">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalSave">保存</button>
    </footer>
  </div>
</div>
<div class="ctx-menu" id="ctxMenu" hidden></div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="/v3/app.js?v=3.6.0-3" defer></script>
</body>
</html>
