[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::ResourceWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# 只挡真正会出错的规则：语法 / 未定义名 / 重复定义。
# 不启用样式类规则，避免存量代码一次性爆几千条噪声。
select = ["E9", "F811", "F821", "F822", "F823"]
